<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Secure A2UI Sandbox</title>
    <!-- Note: We must allow 'unsafe-eval' for babel-standalone and React to function natively inside the browser -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com http://localhost:*; style-src 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: data: http://localhost:*; connect-src 'none'; child-src 'none'; frame-ancestors *;">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: auto;
        min-height: max-content;
        background-color: transparent;
        overflow: hidden !important;
      }
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <script>
      console.log("[SANDBOX] Started sandbox.html execution");
      // Store the latest data globally to fix race conditions where data arrives before React mounts
      window.LATEST_WIDGET_DATA = null;

      function updateSandbox(htmlContent) {
        console.log("[SANDBOX] updateSandbox called, opening document...");
        document.open();
        
        // 1. Prepend the data injection so React can read it on initial mount
        const dataInjection = `<script>console.log("[SANDBOX-INNER] Injected global data:", window.LATEST_WIDGET_DATA); window.LATEST_WIDGET_DATA = ${JSON.stringify(window.LATEST_WIDGET_DATA)};<\/script>`;
        
        // 2. Append the message listener to the end so it survives the document.write wipe
        // We ensure that updates received from the parent are ALWAYS synced to the global variable
        const listenerInjection = `
          <script>
            console.log("[SANDBOX-INNER] Attaching persistent message listener");
            window.addEventListener("message", (event) => {
              if (event.source === window.parent) {
                if (event.data?.type === 'UPDATE_DATA') {
                  console.log("[SANDBOX-INNER] Received UPDATE_DATA payload:", event.data.widgetData);
                  window.LATEST_WIDGET_DATA = event.data.widgetData;
                }
              }
            });
            // Let the parent know this specific document context is ready to receive data
            console.log("[SANDBOX-INNER] Signaling sandbox-ready to parent");
            window.parent.postMessage({ type: "sandbox-ready" }, "*");
          <\/script>
        `;

        document.write(dataInjection + htmlContent + listenerInjection);
        document.close();
        console.log("[SANDBOX] document.write complete");

        setTimeout(() => {
          const contentContainer = document.getElementById('root') || document.body;
          const ro = new ResizeObserver((entries) => {
            if (!contentContainer) return;
            // Measure the exact bounding box of the content, avoiding viewport-relative scrollHeight
            let h = 0;
            if (contentContainer === document.body) {
                h = document.body.offsetHeight;
            } else {
                h = contentContainer.getBoundingClientRect().height;
            }
            if (h > 0) {
               // Add 32px of extra padding to ensure drop shadows aren't clipped
               window.parent.postMessage({ type: 'resize', height: Math.ceil(h) + 32 }, '*');
            }
          });
          ro.observe(contentContainer);
        }, 100);
      }

      // Initial Bootstrap Listener (Waiting for the very first render-html command)
      window.addEventListener("message", function bootstrapListener(event) {
        if (event.source === window.parent) {
          if (event.data?.type === 'render-html') {
             console.log("[SANDBOX] Bootstrap listener received render-html");
             // Remove the bootstrap listener so we don't accidentally double-fire things after document.write
             window.removeEventListener("message", bootstrapListener);
             updateSandbox(event.data.htmlContent);
          } else if (event.data?.type === 'UPDATE_DATA') {
             console.log("[SANDBOX] Bootstrap listener aggressively caching UPDATE_DATA:", event.data.widgetData);
             // Cache it globally if it aggressively arrives before render-html
             window.LATEST_WIDGET_DATA = event.data.widgetData;
          }
        }
      });

      // Signal that the empty sandbox is ready for an initial payload
      console.log("[SANDBOX] Dispatching initial sandbox-ready");
      window.parent.postMessage({ type: "sandbox-ready" }, "*");

      if (window.INITIAL_PAYLOAD) {
        updateSandbox(window.INITIAL_PAYLOAD);
      }
    </script>
</html>
